pre-commit:
  parallel: true
  commands:
    typecheck:
      run: pnpm type-check
    lint:
      glob: "*.{ts,astro}"
      run: pnpm eslint {staged_files} --max-warnings=0
    format:
      glob: "*.{ts,astro,json,css,md}"
      run: pnpm prettier --check {staged_files}
    tokens:
      glob: "design-tokens/tokens.json"
      run: node scripts/generate-tokens.js
    env-manifest:
      run: node scripts/verify-env.js local

commit-msg:
  commands:
    format:
      run: |
        MSG=$(cat {1})
        PATTERN="^(feat|fix|style|perf|content|seo|a11y|chore|docs)(\(.+\))?: .{1,100}$"
        if ! echo "$MSG" | grep -qE "$PATTERN"; then
          echo "❌ Invalid commit message"
          echo "   Expected: type(scope): description"
          echo "   Types: feat|fix|style|perf|content|seo|a11y|chore|docs"
          exit 1
        fi

pre-push:
  commands:
    build:
      run: pnpm build
