[build]
  command   = "pnpm build"
  publish   = "dist"

[build.environment]
  NODE_VERSION = "22"
  PNPM_VERSION = "9"

# ── Security headers ────────────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options             = "nosniff"
    X-Frame-Options                    = "SAMEORIGIN"
    X-DNS-Prefetch-Control             = "on"
    Referrer-Policy                    = "strict-origin-when-cross-origin"
    Strict-Transport-Security          = "max-age=63072000; includeSubDomains; preload"
    Permissions-Policy                 = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy            = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self'; connect-src 'self'; frame-ancestors 'none';"

# No caching on HTML pages
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Long cache on hashed Astro assets
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Long cache on fonts
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ── Redirects ───────────────────────────────────────────────────────────────
[[redirects]]
  from   = "/home"
  to     = "/"
  status = 301
  force  = true

# ── Branch deploys ──────────────────────────────────────────────────────────
[context.staging]
  command = "pnpm build"
  [context.staging.environment]
    NODE_ENV = "staging"

[context.production]
  command = "node scripts/verify-env.js production && pnpm build"
  [context.production.environment]
    NODE_ENV = "production"
