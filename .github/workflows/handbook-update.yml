name: Monthly Handbook Update

on:
  schedule:
    - cron: '0 9 1 * *'   # First day of each month, 09:00 UTC
  workflow_dispatch:        # Allow manual trigger from GitHub UI

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  update:
    name: Check for handbook updates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run handbook update agent
        id: update
        run: |
          node scripts/handbook-update-agent.js
          echo "exit_code=$?" >> $GITHUB_OUTPUT
        continue-on-error: true  # Don't fail the workflow — we handle exit codes below
        env:
          # Optional: GitHub token improves rate limits for advisory queries
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Read report
        id: report
        run: |
          MONTH=$(date +%Y-%m)
          REPORT_FILE="docs/handbook-updates/${MONTH}.md"
          if [ -f "$REPORT_FILE" ]; then
            echo "report_exists=true" >> $GITHUB_OUTPUT
            echo "report_path=$REPORT_FILE" >> $GITHUB_OUTPUT
            # Extract summary for PR body
            SUMMARY=$(head -30 "$REPORT_FILE")
            echo "summary<<EOF" >> $GITHUB_OUTPUT
            echo "$SUMMARY" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: Commit report
        if: steps.report.outputs.report_exists == 'true'
        run: |
          git config user.name  "Handbook Update Agent"
          git config user.email "handbook-bot@nicolapitersky.dev"
          git add docs/handbook-updates/
          git diff --cached --quiet || git commit -m "docs: handbook update report $(date +%Y-%m)"

      - name: Open GitHub issue for critical/high findings
        if: steps.update.outputs.exit_code != '0'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const month = new Date().toISOString().slice(0, 7);
            const summary = `${{ steps.report.outputs.summary }}`;
            const exitCode = '${{ steps.update.outputs.exit_code }}';
            const severity = exitCode === '1' ? '🔴 CRITICAL' : '🟠 HIGH/MEDIUM';

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              title: `${severity} — Handbook updates required — ${month}`,
              body: [
                `The monthly handbook update agent found changes that require review.`,
                ``,
                `**Report:** \`docs/handbook-updates/${month}.md\``,
                ``,
                `## Summary`,
                ``,
                summary,
                ``,
                `## Action required`,
                ``,
                `Review the full report and update the relevant handbook files.`,
                `Once updated, close this issue and update \`CONTRIBUTING.md\` changelog.`,
                ``,
                `*Generated by handbook-update-agent.js*`,
              ].join('\n'),
              labels: ['handbook-update'],
            });

      - name: Open PR if only low/medium findings
        if: steps.update.outputs.exit_code == '2'
        run: |
          MONTH=$(date +%Y-%m)
          BRANCH="handbook-update/${MONTH}"
          git checkout -b "$BRANCH" 2>/dev/null || git checkout "$BRANCH"
          git push origin "$BRANCH" --force-with-lease 2>/dev/null || true
        continue-on-error: true

      - name: Log result
        run: |
          EXIT="${{ steps.update.outputs.exit_code }}"
          if [ "$EXIT" = "0" ]; then
            echo "✅ Handbook is current — no updates needed"
          elif [ "$EXIT" = "1" ]; then
            echo "🔴 Critical findings — GitHub issue opened"
          elif [ "$EXIT" = "2" ]; then
            echo "🟡 Updates found — review docs/handbook-updates/$(date +%Y-%m).md"
          fi
