<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data: https://www.transparenttextures.com https://bible.osipov.uk; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self' https://raw.githubusercontent.com; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
    />
    <title>File Viewer | AI Coding Bible</title>
    <meta name="description" content="Read AI Coding Bible repository files in a clean static viewer." />
    <meta name="robots" content="index,follow" />
    <link id="canonical" rel="canonical" href="https://bible.osipov.uk/docs/viewer.html" />

    <meta property="og:type" content="article" />
    <meta property="og:title" content="File Viewer | AI Coding Bible" />
    <meta property="og:description" content="Read repository files in a clean viewer." />
    <meta property="og:url" content="https://bible.osipov.uk/docs/viewer.html" />
    <meta property="og:image" content="https://bible.osipov.uk/preview.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="File Viewer | AI Coding Bible" />
    <meta name="twitter:description" content="Read repository files in a clean viewer." />
    <meta name="twitter:image" content="https://bible.osipov.uk/preview.png" />

    <script id="breadcrumb-schema" type="application/ld+json"></script>

    <style>
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: #1a1a22 url("https://www.transparenttextures.com/patterns/carbon-fibre.png");
        color: #f4f5f8;
      }
      .container {
        width: min(1120px, 94vw);
        margin: 0 auto;
        padding: 2rem 0 3rem;
      }
      .crumbs,
      .crumbs a {
        color: #cab590;
        text-decoration: none;
        font-size: 0.9rem;
      }
      h1 {
        margin: 0.7rem 0;
        overflow-wrap: anywhere;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.6rem;
        margin-bottom: 1rem;
      }
      .btn {
        text-decoration: none;
        border: 1px solid #5e5442;
        border-radius: 8px;
        padding: 0.45rem 0.7rem;
        color: #cab590;
      }
      .panel {
        border: 1px solid #373747;
        border-radius: 12px;
        background: #24242f;
        padding: 1rem;
      }
      pre {
        white-space: pre-wrap;
        line-height: 1.5;
        margin: 0;
        color: #e7e9ef;
        overflow-wrap: anywhere;
      }
      .muted {
        color: #b1b5c3;
      }
      .error {
        color: #f2b8b8;
      }
    </style>
  </head>
  <body>
    <main class="container">
      <nav class="crumbs"><a href="../">Home</a> / <a href="./">Repository Explorer</a> / <span id="crumbFile">File</span></nav>
      <h1 id="title">File Viewer</h1>
      <p class="muted" id="subtitle">Loading file...</p>

      <div class="actions">
        <a class="btn" href="./">Back to explorer</a>
        <a id="githubLink" class="btn" href="https://github.com/nicolapitersky/Bible" target="_blank" rel="noopener noreferrer">Open on GitHub</a>
      </div>

      <section class="panel">
        <pre id="content">Loading...</pre>
      </section>
    </main>

    <script>
      (function () {
        var OWNER = "nicolapitersky";
        var REPO = "Bible";
        var BRANCH = "main";

        var params = new URLSearchParams(window.location.search);
        var filePath = params.get("path") || "README.md";

        if (!/^[A-Za-z0-9._\-\/]+$/.test(filePath) || filePath.indexOf("..") !== -1) {
          filePath = "README.md";
        }

        var title = filePath + " | AI Coding Bible";
        document.title = title;
        document.getElementById("title").textContent = filePath;
        document.getElementById("crumbFile").textContent = filePath;
        document.getElementById("subtitle").textContent = "Static reader view sourced from GitHub main branch.";

        var canonical = "https://bible.osipov.uk/docs/viewer.html?path=" + encodeURIComponent(filePath);
        document.getElementById("canonical").setAttribute("href", canonical);

        var github = "https://github.com/" + OWNER + "/" + REPO + "/blob/" + BRANCH + "/" + filePath;
        document.getElementById("githubLink").setAttribute("href", github);

        var schema = {
          "@context": "https://schema.org",
          "@graph": [
            {
              "@type": "Organization",
              name: "AI Coding Bible",
              url: "https://bible.osipov.uk/"
            },
            {
              "@type": "BreadcrumbList",
              itemListElement: [
                { "@type": "ListItem", position: 1, name: "Home", item: "https://bible.osipov.uk/" },
                { "@type": "ListItem", position: 2, name: "Repository Explorer", item: "https://bible.osipov.uk/docs/" },
                { "@type": "ListItem", position: 3, name: filePath, item: canonical }
              ]
            }
          ]
        };
        document.getElementById("breadcrumb-schema").textContent = JSON.stringify(schema);

        var metaPairs = [
          ["meta[property='og:title']", title],
          ["meta[name='twitter:title']", title],
          ["meta[property='og:description']", "Read " + filePath + " in AI Coding Bible."],
          ["meta[name='twitter:description']", "Read " + filePath + " in AI Coding Bible."],
          ["meta[property='og:url']", canonical],
          ["meta[name='description']", "Read " + filePath + " in AI Coding Bible static file viewer."]
        ];
        metaPairs.forEach(function (pair) {
          var el = document.querySelector(pair[0]);
          if (el) el.setAttribute("content", pair[1]);
        });

        fetch("https://raw.githubusercontent.com/" + OWNER + "/" + REPO + "/" + BRANCH + "/" + filePath)
          .then(function (res) {
            if (!res.ok) throw new Error("not-found");
            return res.text();
          })
          .then(function (text) {
            document.getElementById("content").textContent = text;
          })
          .catch(function () {
            var content = document.getElementById("content");
            content.textContent =
              "Unable to load file: " +
              filePath +
              "\n\nUse 'Open on GitHub' to read it directly or return to the explorer.";
            content.className = "error";
          });
      })();
    </script>
  </body>
</html>
